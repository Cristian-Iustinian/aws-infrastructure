---
- name: Install Docker and Git
  hosts: all
  become: true

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes

    - name: Install docker
      ansible.builtin.apt: 
        name: docker.io
        state: present

    - name: Install git
      ansible.builtin.apt: 
        name: git
        state: present
